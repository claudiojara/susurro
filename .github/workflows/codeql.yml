name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: swift
          build-mode: manual

      # Build each package on its own so sources the app does not link are analyzed too,
      # then build the app (xcodegen + xcodebuild) for the App/ sources.
      #
      # The SwiftPM and Xcode manifest sandboxes are disabled under the CodeQL tracer. The tracer
      # injects libtrace.dylib with DYLD_INSERT_LIBRARIES, so it re-runs SIP-protected system tools
      # from a copy (SEMMLE_COPY_EXECUTABLES_ROOT). The copy of /usr/bin/sandbox-exec cannot run its
      # arm64e slice as a non-platform binary, which fails with "Bad CPU type in executable (86)"
      # before any manifest loads. The runner is ephemeral and builds only this repository's code.
      - name: Build packages
        run: |
          for pkg in SusurroCore SusurroPlatform SusurroInference SusurroUI SusurroFeatures; do
            echo "==> swift build: $pkg"
            swift build --disable-sandbox --package-path "Packages/$pkg"
          done

      - name: Build app
        run: >-
          make build
          SWIFTPM_FLAGS="--disable-keychain --disable-sandbox"
          XCODEBUILD_PACKAGE_FLAGS="-clonedSourcePackagesDirPath build/SourcePackages -disableAutomaticPackageResolution
          -IDEPackageSupportDisableManifestSandbox=YES -IDEPackageSupportDisablePluginExecutionSandbox=YES"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:swift
