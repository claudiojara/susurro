name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: swift
          build-mode: manual

      - name: Install tools
        run: command -v xcodegen >/dev/null || brew install xcodegen

      # Build each package on its own so sources the app does not link are analyzed too,
      # then build the app (xcodegen + xcodebuild) for the App/ sources.
      - name: Build packages
        run: |
          for pkg in SusurroCore SusurroPlatform SusurroInference SusurroUI SusurroFeatures; do
            echo "==> swift build: $pkg"
            swift build --package-path "Packages/$pkg"
          done

      - name: Build app
        run: make build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:swift
