name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by record-snapshots after it commits references, because a push by the workflow token starts no workflow.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache SwiftPM build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/*/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # The pictures depend on the macOS and Xcode of the image, so the log says which one this was.
      - name: Runner image
        run: |
          sw_vers
          xcodebuild -version
          echo "Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: Install tools
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Bootstrap
        run: make bootstrap

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Snapshots
        env:
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-failures
        run: make snapshots

      # The picture that failed, the reference, and the difference, for a check that does not pass.
      - name: Upload the pictures of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-failures
          path: ${{ runner.temp }}/snapshot-failures
          if-no-files-found: ignore

      - name: Build
        run: make build
